[project]
name = "bangtrix-toolkit"
description = "Real-time ComfyUI Hardware Monitor with native AMD ROCm and All GPU/APU NVIDIA support and Universal Prompt Translator node for multilingual AI workflows."
version = "1.3.7"
license = { file = "LICENSE" }
dependencies = [
    "aiohttp>=3.8.0",
    "requests>=2.31.0",
    "async-timeout>=4.0.0",
    "psutil>=5.9.0",
    "pywin32>=306; sys_platform == 'win32'",
    "pynvml>=11.5.0",
]

[project.urls]
Repository = "https://github.com/Anonymzx/BangtrixToolkit"
Issues = "https://github.com/Anonymzx/BangtrixToolkit/issues"

[tool.comfy]
PublisherId = "anonymzx"
DisplayName = "Bangtrix Toolkit"
Icon = "https://i.ibb.co.com/v6n1h5tc/LOGO-BULAT-FIX.png"