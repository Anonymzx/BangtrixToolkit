name: Publish to ComfyUI Registry

# Triggers:
#  - manual run from the Actions tab (workflow_dispatch)
#  - any push to main that changes pyproject.toml — fires once per push
#    and short-circuits when the file is untouched, so casual commits
#    don't spam the registry.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pyproject.toml']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish node to ComfyUI Registry
        # Official publish action — wraps `comfy node publish` with
        # the API key from the REGISTRY_ACCESS_TOKEN secret. The
        # registry reads the version from pyproject.toml, so a
        # version bump there is enough to ship a new release.
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}